# Portable Linux x64 build: manylinux_2_28 (AlmaLinux 8, glibc 2.28, gcc-toolset) + vcpkg (static libraries, the
# same manifest as the Windows build), so the program runs on any distro with glibc >= 2.28 (Debian 10+,
# Ubuntu 20.04+, RHEL 8+, ...). The steps are in scripts/ci/build-linux.sh, and scripts/ci/linux-container.sh runs
# them locally in the same container.
#
# Produces ngscopeclient-linux-x64.tar.gz (extracting to ngscopeclient/, the executable ngscopeclient/ngscopeclient).
# The unit tests run in a second job on a stock Ubuntu runner, on Mesa's software Vulkan driver (lavapipe): EL8's
# lavapipe fails to create an instance, and running the manylinux binaries on another distro checks that they're
# portable. Pushes to master also put the tarball on the "nightly" prerelease, next to the Windows zip
# (build-windows.yml, which also moves the nightly tag and writes the release notes).

name: Build Linux

on:
  push:
    branches: [master]
    paths-ignore: ['doc/**', 'devdoc/**', '**.md', 'release-notes/**']
  pull_request:
    paths-ignore: ['doc/**', 'devdoc/**', '**.md', 'release-notes/**']
  workflow_dispatch:

# A newer push to the same branch cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manylinux:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 240
    outputs:
      suffix: ${{ steps.suffix.outputs.suffix }}

    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,/__w/vcpkg-binary-cache,readwrite
      CCACHE_DIR: /__w/ccache
      CCACHE_MAXSIZE: 2G

    steps:
    - name: Check out
      uses: actions/checkout@v4
      with:
        fetch-depth: 0      # git describe gives the version string
        submodules: false

    # The workspace is owned by the runner's user, not the container's root
    - name: Submodules
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        # Everything but doc/upstream (only the manual's images, not needed to build the program)
        git -c submodule.doc/upstream.update=none submodule update --init --recursive --depth 1

    - name: System packages
      run: scripts/ci/build-linux.sh deps

    - name: vcpkg at the manifest's baseline
      run: |
        scripts/ci/build-linux.sh vcpkg
        mkdir -p /__w/vcpkg-binary-cache

    # vcpkg's built packages. vcpkg checks each package's ABI hash itself, so a cache from an older manifest is
    # safe to start from; a new entry is saved only when the manifest or ports changed.
    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: /__w/vcpkg-binary-cache
        key: vcpkg-manylinux-release-${{ hashFiles('msvc/vcpkg.json', 'msvc/ports/**') }}
        restore-keys: vcpkg-manylinux-release-

    - name: Compiler cache
      uses: actions/cache@v4
      with:
        path: /__w/ccache
        key: ccache-manylinux-${{ github.run_id }}
        restore-keys: ccache-manylinux-

    - name: Configure
      run: scripts/ci/build-linux.sh configure

    - name: Save vcpkg binary cache
      if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /__w/vcpkg-binary-cache
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Build
      run: |
        scripts/ci/build-linux.sh build
        ccache -s

    - name: Package
      run: scripts/ci/build-linux.sh package

    - name: Artifact name
      id: suffix
      run: |
        sha=$(echo "$GITHUB_SHA" | cut -c1-8)
        echo "ARTIFACT_SUFFIX=$sha" >> "$GITHUB_ENV"
        echo "suffix=$sha" >> "$GITHUB_OUTPUT"

    # The tarball, not the folder: artifacts are zipped, which would lose the executable bits
    - name: Upload program
      uses: actions/upload-artifact@v4
      with:
        name: ngscopeclient-linux-x64-${{ env.ARTIFACT_SUFFIX }}
        path: dist/ngscopeclient-linux-x64.tar.gz
        if-no-files-found: error

    - name: Upload tests
      uses: actions/upload-artifact@v4
      with:
        name: ngscopeclient-linux-x64-${{ env.ARTIFACT_SUFFIX }}-tests
        path: dist/ngscopeclient-linux-x64-tests.tar.gz
        if-no-files-found: error
        retention-days: 7

  # The unit tests, built in the manylinux job, on a stock distro with Mesa's lavapipe
  test:
    needs: manylinux
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Check out the scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: scripts/ci

    - name: Vulkan (lavapipe)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libgomp1 libx11-6 \
          libwayland-client0 libdbus-1-3 libudev1

    - name: Download tests
      uses: actions/download-artifact@v4
      with:
        name: ngscopeclient-linux-x64-${{ needs.manylinux.outputs.suffix }}-tests
        path: dist

    - name: Test
      run: |
        mkdir tests-bundle
        tar -C tests-bundle -xzf dist/ngscopeclient-linux-x64-tests.tar.gz
        TEST_DIR="$PWD/tests-bundle" scripts/ci/build-linux.sh test

  # Puts the tarball on the rolling "nightly" prerelease (see build-windows.yml, which makes the release, moves its
  # tag and writes its notes). Same concurrency group as the Windows upload, so the two don't race.
  nightly:
    needs: [manylinux, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Download program
      uses: actions/download-artifact@v4
      with:
        name: ngscopeclient-linux-x64-${{ needs.manylinux.outputs.suffix }}
        path: dist

    - name: Update the nightly release
      run: |
        if ! gh release view nightly > /dev/null 2>&1; then
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly build" --notes "Latest build of master: ${GITHUB_SHA::8}. Unreleased development build, replaced by every push to master."
        fi
        gh release upload nightly dist/ngscopeclient-linux-x64.tar.gz --clobber
