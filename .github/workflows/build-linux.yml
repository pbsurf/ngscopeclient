name: Build Linux (draft)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manylinux:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 240

    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,/__w/vcpkg-binary-cache,readwrite
      VCPKG_DISABLE_METRICS: 1
      VCPKG_FORCE_SYSTEM_BINARIES: 0

    steps:
    - name: System packages
      run: |
        dnf install -y epel-release
        dnf install -y --enablerepo=powertools \
          git curl zip unzip tar ninja-build ccache perl-IPC-Cmd autoconf automake libtool kernel-headers \
          libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel \
          libXfixes-devel libXScrnSaver-devel libxkbcommon-devel wayland-devel wayland-protocols-devel \
          mesa-libEGL-devel mesa-libGL-devel gtk3-devel dbus-devel systemd-devel redhat-lsb-core \
          mesa-vulkan-drivers
        python3 -m pip install --upgrade cmake
        gcc --version

    - name: Check out
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: false

    - name: Submodules
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule update --init --recursive --depth 1 -- \
          lib/VkFFT lib/canvas_ity lib/xptools \
          src/ImGuiFileDialog src/imgui_markdown src/nativefiledialog-extended

    - name: vcpkg at the manifest's baseline
      run: |
        baseline=$(python3 -c "import json; print(json.load(open('msvc/vcpkg.json'))['builtin-baseline'])")
        git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
        git -C "$VCPKG_ROOT" checkout --quiet "$baseline"
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        mkdir -p /__w/vcpkg-binary-cache

    - name: Restore vcpkg binary cache
      id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: /__w/vcpkg-binary-cache
        key: vcpkg-manylinux-release-${{ hashFiles('msvc/vcpkg.json', 'msvc/ports/**') }}
        restore-keys: vcpkg-manylinux-release-

    - name: Compiler cache
      uses: actions/cache@v4
      with:
        path: /__w/ccache
        key: ccache-manylinux-${{ github.run_id }}
        restore-keys: ccache-manylinux-

    - name: Pico SDK headers
      run: python3 scripts/ci/fetch-pico-headers.py "$RUNNER_TEMP/pico-sdk-inc"

    - name: Configure
      env:
        CCACHE_DIR: /__w/ccache
      run: |
        cmake -S . -B build/linux -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_MANIFEST_DIR="$PWD/msvc" \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DVCPKG_HOST_TRIPLET=x64-linux-release \
          "-DVCPKG_MANIFEST_FEATURES=iio" \
          -DPKG_CONFIG_EXECUTABLE="$PWD/build/linux/vcpkg_installed/x64-linux-release/tools/pkgconf/pkgconf" \
          -DVulkan_GLSLC_EXECUTABLE="$PWD/build/linux/vcpkg_installed/x64-linux-release/tools/shaderc/glslc" \
          -DPICO_SDK_INCLUDE_DIR="$RUNNER_TEMP/pico-sdk-inc" \
          -DREQUIRE_PICO=ON \
          -DNFD_PORTAL=ON \
          -DBUILD_TESTING=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Save vcpkg binary cache
      if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /__w/vcpkg-binary-cache
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Build
      env:
        CCACHE_DIR: /__w/ccache
        CCACHE_MAXSIZE: 2G
      run: cmake --build build/linux

    - name: Show dynamic dependencies
      run: |
        ldd build/linux/src/ngscopeclient/ngscopeclient
        objdump -T build/linux/src/ngscopeclient/ngscopeclient | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

    # TODO: package properly (see the top of this file)
    - name: Upload program
      uses: actions/upload-artifact@v4
      with:
        name: ngscopeclient-linux-x64-draft
        path: |
          build/linux/src/ngscopeclient/ngscopeclient
          build/linux/src/ngscopeclient/channels
          build/linux/src/ngscopeclient/fonts
          build/linux/src/ngscopeclient/icons
          build/linux/src/ngscopeclient/masks
          build/linux/src/ngscopeclient/md
          build/linux/src/ngscopeclient/shaderfusion
          build/linux/src/ngscopeclient/shaders
          build/linux/lib/scopehal/libscopehal.so
          build/linux/lib/scopeprotocols/libscopeprotocols.so
        if-no-files-found: error
